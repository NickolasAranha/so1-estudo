<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SO1 · Estudo</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Aplica o tema salvo antes de pintar a página.
    try {
      var t = JSON.parse(localStorage.getItem('so1-progresso-v1') || '{}').tema;
      if (t) document.documentElement.setAttribute('data-theme', t === 'escuro' ? 'dark' : 'light');
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topo">
    <button class="abrir-menu" aria-label="Abrir a lista de aulas" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <a href="#/" class="logo" aria-label="SO1, início">
      <span class="logo-icone" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 3v3M12 3v3M15 3v3M9 18v3M12 18v3M15 18v3M3 9h3M3 12h3M3 15h3M18 9h3M18 12h3M18 15h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      <span class="logo-texto">SO1 <span>Estudo</span></span>
    </a>
    <nav class="menu-topo" aria-label="Seções">
      <a href="#/" data-rota="home">Início</a>
      <a href="#/revisar" data-rota="revisar">Revisar</a>
    </nav>
    <div class="topo-direita">
      <span class="contagem-topo" id="contagem-topo"></span>
      <button class="alternar-tema" aria-label="Alternar tema claro e escuro" title="Alternar tema">
        <svg class="icone-lua" viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 12.6A6.5 6.5 0 0 1 7.4 4.5a6.5 6.5 0 1 0 8.1 8.1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <svg class="icone-sol" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 2.5v1.8M10 15.7v1.8M2.5 10h1.8M15.7 10h1.8M4.7 4.7l1.3 1.3M14 14l1.3 1.3M4.7 15.3 6 14M14 6l1.3-1.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Aulas"></aside>
    <main class="principal">
      <p class="aviso-storage" hidden>Seu navegador não permite salvar dados: o progresso não será salvo depois de fechar a página.</p>
      <div id="conteudo"><p class="carregando">Carregando…</p></div>
    </main>
  </div>
  <div class="veu" hidden></div>

  <script src="js/core/registry.js"></script>
  <script src="js/core/quiz.js"></script>
  <script src="js/core/progress.js"></script>
  <script src="js/core/plan.js"></script>
  <script src="js/ui/render.js"></script>
  <script src="conteudo/modulos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
